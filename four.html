<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odd One Out Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <h1>Odd One Out Game</h1>
    <p>Click on the different item! ⏱ <span id="timer">15</span>s left</p>
    
    <div id="emoji-grid"></div>
    
    <div id="result"></div>
    <button id="next-btn">Next</button>
    
    <div id="certificate" class="hidden">
        <h2>🎉 Congratulations! 🎉</h2>
        <p>Your Score: <span id="final-score"></span>/10</p>
        <img src="https://cdn-icons-png.flaticon.com/512/2583/2583135.png" alt="Trophy" width="100">
        <p>Keep up the great work!</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
